<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1707 178' width='1707' height='178' role='img' aria-label='05 — Signal chain from light to lamp'>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#495057'/></marker></defs>
<rect width='1707' height='178' fill='#ffffff'/>
<text x='853.5' y='30' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='middle' font-weight='bold' fill='#1c2733'>05 — Signal chain from light to lamp</text>
<rect x='40' y='80' width='192' height='74' rx='12' fill='#e7f5ff' stroke='#1971c2' stroke-width='1.5'/>
<text x='136.0' y='114.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='bold' fill='#1c2733'>LDR divider</text>
<text x='136.0' y='130.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='normal' fill='#1c2733'>resistance → voltage</text>
<rect x='382' y='80' width='120' height='74' rx='12' fill='#e7f5ff' stroke='#1971c2' stroke-width='1.5'/>
<text x='442.0' y='114.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='bold' fill='#1c2733'>ADC</text>
<text x='442.0' y='130.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='normal' fill='#1c2733'>every 50 ms</text>
<rect x='652' y='80' width='183' height='74' rx='12' fill='#e7f5ff' stroke='#1971c2' stroke-width='1.5'/>
<text x='743.5' y='114.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='bold' fill='#1c2733'>Moving average</text>
<text x='743.5' y='130.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='normal' fill='#1c2733'>90 % old + 10 % new</text>
<rect x='985' y='80' width='142' height='74' rx='12' fill='#e7f5ff' stroke='#1971c2' stroke-width='1.5'/>
<text x='1056.0' y='114.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='bold' fill='#1c2733'>Hysteresis</text>
<text x='1056.0' y='130.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='normal' fill='#1c2733'>set point ± 40</text>
<rect x='1277' y='80' width='120' height='74' rx='12' fill='#e7f5ff' stroke='#1971c2' stroke-width='1.5'/>
<text x='1337.0' y='114.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='bold' fill='#1c2733'>Dwell time</text>
<text x='1337.0' y='130.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='normal' fill='#1c2733'>3 s minimum</text>
<rect x='1547' y='80' width='120' height='74' rx='12' fill='#e7f5ff' stroke='#1971c2' stroke-width='1.5'/>
<text x='1607.0' y='114.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='bold' fill='#1c2733'>Lamp</text>
<text x='1607.0' y='130.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='normal' fill='#1c2733'>D9</text>
<line x1='236' y1='117.0' x2='378' y2='117.0' stroke='#495057' stroke-width='1.8' marker-end='url(#arrow)'/>
<text x='307.0' y='109.0' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#495057'>0–5 V</text>
<line x1='506' y1='117.0' x2='648' y2='117.0' stroke='#495057' stroke-width='1.8' marker-end='url(#arrow)'/>
<text x='577.0' y='109.0' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#495057'>0–1023</text>
<line x1='839' y1='117.0' x2='981' y2='117.0' stroke='#495057' stroke-width='1.8' marker-end='url(#arrow)'/>
<text x='910.0' y='109.0' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#495057'>smoothed</text>
<line x1='1131' y1='117.0' x2='1273' y2='117.0' stroke='#495057' stroke-width='1.8' marker-end='url(#arrow)'/>
<text x='1202.0' y='96.0' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#495057'>on / off</text>
<text x='1202.0' y='109.0' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#495057'>request</text>
<line x1='1401' y1='117.0' x2='1543' y2='117.0' stroke='#495057' stroke-width='1.8' marker-end='url(#arrow)'/>
<text x='1472.0' y='109.0' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#495057'>switch</text>
</svg>
