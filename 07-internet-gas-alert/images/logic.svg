<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1435 178' width='1435' height='178' role='img' aria-label='07 — From sensor to phone'>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#495057'/></marker></defs>
<rect width='1435' height='178' fill='#ffffff'/>
<text x='717.5' y='30' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='middle' font-weight='bold' fill='#1c2733'>07 — From sensor to phone</text>
<text x='717.5' y='50' font-family='Helvetica, Arial, sans-serif' font-size='12' text-anchor='middle' font-weight='normal' fill='#5b6b7b'>The local buzzer is driven by the detection step and never waits for the network</text>
<rect x='40' y='80' width='120' height='74' rx='12' fill='#e7f5ff' stroke='#1971c2' stroke-width='1.5'/>
<text x='100.0' y='114.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='bold' fill='#1c2733'>MQ-2</text>
<text x='100.0' y='130.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='normal' fill='#1c2733'>sensor</text>
<rect x='310' y='80' width='200' height='74' rx='12' fill='#ffe3e3' stroke='#c92a2a' stroke-width='1.5'/>
<text x='410.0' y='114.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='bold' fill='#1c2733'>Detection</text>
<text x='410.0' y='130.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='normal' fill='#1c2733'>baseline + hysteresis</text>
<rect x='660' y='80' width='150' height='74' rx='12' fill='#e7f5ff' stroke='#1971c2' stroke-width='1.5'/>
<text x='735.0' y='114.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='bold' fill='#1c2733'>Pending message</text>
<text x='735.0' y='130.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='normal' fill='#1c2733'>newest only</text>
<rect x='960' y='80' width='159' height='74' rx='12' fill='#e7f5ff' stroke='#1971c2' stroke-width='1.5'/>
<text x='1039.5' y='114.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='bold' fill='#1c2733'>Telegram Bot API</text>
<text x='1039.5' y='130.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='normal' fill='#1c2733'>cloud</text>
<rect x='1269' y='80' width='126' height='74' rx='12' fill='#e7f5ff' stroke='#1971c2' stroke-width='1.5'/>
<text x='1332.0' y='114.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='bold' fill='#1c2733'>Phone</text>
<text x='1332.0' y='130.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='normal' fill='#1c2733'>notification</text>
<line x1='164' y1='117.0' x2='306' y2='117.0' stroke='#495057' stroke-width='1.8' marker-end='url(#arrow)'/>
<text x='235.0' y='96.0' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#495057'>ADC</text>
<text x='235.0' y='109.0' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#495057'>100 ms</text>
<line x1='514' y1='117.0' x2='656' y2='117.0' stroke='#495057' stroke-width='1.8' marker-end='url(#arrow)'/>
<text x='585.0' y='96.0' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#495057'>alarm /</text>
<text x='585.0' y='109.0' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#495057'>cleared</text>
<line x1='814' y1='117.0' x2='956' y2='117.0' stroke='#495057' stroke-width='1.8' marker-end='url(#arrow)'/>
<text x='885.0' y='96.0' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#495057'>HTTPS POST</text>
<text x='885.0' y='109.0' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#495057'>retry 10 s</text>
<line x1='1123' y1='117.0' x2='1265' y2='117.0' stroke='#495057' stroke-width='1.8' marker-end='url(#arrow)'/>
<text x='1194.0' y='109.0' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#495057'>push</text>
