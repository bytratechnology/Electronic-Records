<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1126 222' width='1126' height='222' role='img' aria-label='02 — Alarm state machine'>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#495057'/></marker></defs>
<rect width='1126' height='222' fill='#ffffff'/>
<text x='563.0' y='30' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='middle' font-weight='bold' fill='#1c2733'>02 — Alarm state machine</text>
<rect x='40' y='80' width='183' height='74' rx='12' fill='#e7f5ff' stroke='#1971c2' stroke-width='1.5'/>
<text x='131.5' y='114.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='bold' fill='#1c2733'>WARMING_UP</text>
<text x='131.5' y='130.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='normal' fill='#1c2733'>green blinks slowly</text>
<rect x='373' y='80' width='167' height='74' rx='12' fill='#e7f5ff' stroke='#1971c2' stroke-width='1.5'/>
<text x='456.5' y='114.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='bold' fill='#1c2733'>CALIBRATING</text>
<text x='456.5' y='130.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='normal' fill='#1c2733'>green blinks fast</text>
<rect x='690' y='80' width='120' height='74' rx='12' fill='#e7f5ff' stroke='#1971c2' stroke-width='1.5'/>
<text x='750.0' y='114.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='bold' fill='#1c2733'>MONITORING</text>
<text x='750.0' y='130.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='normal' fill='#1c2733'>green on</text>
<rect x='960' y='80' width='126' height='74' rx='12' fill='#ffe3e3' stroke='#c92a2a' stroke-width='1.5'/>
<text x='1023.0' y='114.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='bold' fill='#1c2733'>ALARM</text>
<text x='1023.0' y='130.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='normal' fill='#1c2733'>red + buzzer</text>
<line x1='227' y1='117.0' x2='369' y2='117.0' stroke='#495057' stroke-width='1.8' marker-end='url(#arrow)'/>
<text x='298.0' y='109.0' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#495057'>60 s</text>
<line x1='544' y1='117.0' x2='686' y2='117.0' stroke='#495057' stroke-width='1.8' marker-end='url(#arrow)'/>
<text x='615.0' y='96.0' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#495057'>50 samples</text>
<text x='615.0' y='109.0' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#495057'>= baseline</text>
<line x1='814' y1='117.0' x2='956' y2='117.0' stroke='#495057' stroke-width='1.8' marker-end='url(#arrow)'/>
<text x='885.0' y='109.0' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#495057'>gas &gt; baseline + 150</text>
<path d='M1003.0,158 L1003.0,188 L770.0,188 L770.0,160' fill='none' stroke='#868e96' stroke-width='1.6' stroke-dasharray='6 4' marker-end='url(#arrow)'/>
<text x='886.5' y='203' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#495057'>gas &lt; baseline + 100</text>
</svg>
