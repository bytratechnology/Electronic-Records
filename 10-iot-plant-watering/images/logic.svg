<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 801 222' width='801' height='222' role='img' aria-label='10 — Watering cycle'>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#495057'/></marker></defs>
<rect width='801' height='222' fill='#ffffff'/>
<text x='400.5' y='30' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='middle' font-weight='bold' fill='#1c2733'>10 — Watering cycle</text>
<text x='400.5' y='50' font-family='Helvetica, Arial, sans-serif' font-size='12' text-anchor='middle' font-weight='normal' fill='#5b6b7b'>At most 6 automatic runs per 24 h, so a failed sensor cannot empty the tank</text>
<rect x='40' y='80' width='159' height='74' rx='12' fill='#e7f5ff' stroke='#1971c2' stroke-width='1.5'/>
<text x='119.5' y='114.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='bold' fill='#1c2733'>IDLE</text>
<text x='119.5' y='130.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='normal' fill='#1c2733'>measure moisture</text>
<rect x='349' y='80' width='120' height='74' rx='12' fill='#e7f5ff' stroke='#1971c2' stroke-width='1.5'/>
<text x='409.0' y='114.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='bold' fill='#1c2733'>PUMPING</text>
<text x='409.0' y='130.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='normal' fill='#1c2733'>pump on</text>
<rect x='619' y='80' width='142' height='74' rx='12' fill='#e7f5ff' stroke='#1971c2' stroke-width='1.5'/>
<text x='690.0' y='114.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='bold' fill='#1c2733'>SOAKING</text>
<text x='690.0' y='130.0' font-family='Helvetica, Arial, sans-serif' font-size='13' text-anchor='middle' font-weight='normal' fill='#1c2733'>pump off, wait</text>
<line x1='203' y1='117.0' x2='345' y2='117.0' stroke='#495057' stroke-width='1.8' marker-end='url(#arrow)'/>
<text x='274.0' y='96.0' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#495057'>moisture &lt; start %</text>
<text x='274.0' y='109.0' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#495057'>and runs left today</text>
<line x1='473' y1='117.0' x2='615' y2='117.0' stroke='#495057' stroke-width='1.8' marker-end='url(#arrow)'/>
<text x='544.0' y='96.0' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#495057'>pump time over</text>
<text x='544.0' y='109.0' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#495057'>(hard cap 30 s)</text>
<path d='M670.0,158 L670.0,188 L139.5,188 L139.5,160' fill='none' stroke='#868e96' stroke-width='1.6' stroke-dasharray='6 4' marker-end='url(#arrow)'/>
<text x='404.75' y='203' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#495057'>soak time over — measure again</text>
</svg>
